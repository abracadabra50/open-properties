[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-properties"
version = "1.1.0"
description = "CLI, MCP and Skills for the world's property portals — search and monitor listings across 9 providers in 9 countries"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Zish Ashraf"}]
keywords = ["property", "real-estate", "rightmove", "daft", "domain", "idealista", "immoscout24", "rentcast", "realtor", "cli", "mcp", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/abracadabra50/open-properties"
Repository = "https://github.com/abracadabra50/open-properties"
Issues = "https://github.com/abracadabra50/open-properties/issues"

[project.scripts]
property = "open_properties.cli:main"
property-mcp = "open_properties.mcp_server:main"
uk-property = "uk_property_cli.cli:main"
uk-property-mcp = "uk_property_cli.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_properties*", "uk_property_cli*"]
